<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
 <title id="title">Toque IT e Home Assistant — anteprima illustrativa di 9 entità MQTT</title>
 <desc id="desc">Illustrazione, non screenshot: pannello Home Assistant con nove sensori di temperatura, velocità, peso, motore, riscaldamento, coperchio ed errori. Dati simulati.</desc>
