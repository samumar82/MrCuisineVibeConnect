  <radialGradient id="glow"><stop stop-color="#0E766D" stop-opacity=".42"/><stop offset="1" stop-color="#0E766D" stop-opacity="0"/></radialGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000A15" flood-opacity=".42"/></filter>
 </defs>
